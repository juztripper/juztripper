name: voyage log

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    paths: ['art/**', '.github/workflows/voyage.yml']

permissions:
  contents: write

concurrency:
  group: voyage
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: redraw the sea
        env:
          # optional: add a VOYAGE_TOKEN secret (classic pat, read:user) to count private contributions too
          GITHUB_TOKEN: ${{ secrets.VOYAGE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          node art/build.mjs
          node art/voyage.mjs ${{ github.repository_owner }}
      - name: commit if anything changed
        run: |
          git config user.name 'voyage-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets
          git diff --cached --quiet && exit 0
          git commit -m 'redraw voyage log'
          git push
